name: PR Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.4"

      - name: Run PR checks
        run: uv run python ./scripts/youpu check-pr
