name: PR Check

on:
  pull_request:

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run PR checks
        run: python3 youpu check-pr
