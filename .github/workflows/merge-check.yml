name: Merge Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.4"

      - name: Run merge checks
        id: check_merge
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          log_path="$RUNNER_TEMP/check-merge.log"
          echo "log_path=$log_path" >> "$GITHUB_OUTPUT"
          uv run python ./scripts/youpu check-merge 2>&1 | tee "$log_path"

      - name: Post merge check failure summary
        if: ${{ steps.check_merge.outcome == 'failure' }}
        uses: actions/github-script@v8
        env:
          LOG_PATH: ${{ steps.check_merge.outputs.log_path }}
        with:
          script: |
            const fs = require("fs");
            const logPath = process.env.LOG_PATH;
            const marker = "<!-- youpu:merge-check-failure-summary -->";
            const log = logPath && fs.existsSync(logPath) ? fs.readFileSync(logPath, "utf8") : "";
            const lines = log
              .split("\n")
              .map((line) => line.trimEnd())
              .filter((line) => line.trim().length > 0);
            const important = lines.filter((line) =>
              line.startsWith("Merge check failed") ||
              line.startsWith("ERROR:") ||
              line.startsWith("WARNING:")
            );
            const snippet = (important.length ? important : lines.slice(-20)).slice(0, 20).join("\n");
            const body = [
              marker,
              "**Merge Check failed**",
              "",
              "`youpu check-merge` returned a validation failure.",
              "",
              "```text",
              snippet || "No log output captured.",
              "```",
              "",
              "Full details are available in the failed `Run merge checks` step log.",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.login === "github-actions[bot]" && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Clear merge check failure summary on success
        if: ${{ steps.check_merge.outcome == 'success' }}
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- youpu:merge-check-failure-summary -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.login === "github-actions[bot]" && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existing.id,
              });
            }

      - name: Fail workflow on merge check failure
        if: ${{ steps.check_merge.outcome == 'failure' }}
        run: exit 1
