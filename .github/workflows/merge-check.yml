name: Merge Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.4"

      - name: Run merge checks
        run: uv run python ./scripts/youpu check-merge
