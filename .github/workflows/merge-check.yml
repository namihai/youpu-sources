name: Merge Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run merge checks
        run: ./scripts/youpu check-merge
